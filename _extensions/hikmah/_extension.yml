title: Hikmah
author: Andrew Heiss
version: 0.1.0
quarto-required: ">=1.8"
contributes:
  formats:
    common:
      date-format: full

    typst:
      citeproc: true

      link-citations: true
      linkcolor: "#483D8B"
      citecolor: "#483D8B"

      template-partials:
        - "partials/typst-show.typ"
        - "partials/typst-template.typ"
      
      margin:
        top: 120pt    # 10p0
        bottom: 120pt #10p0
        left: 132pt   # 11p0
        right: 132pt  # 11p0

    pdf:
      # Template pieces
      template-partials:
        - "partials/title.tex"
        - "partials/before-body.tex"
      include-in-header:
        - "include-in-header.tex"
      
      # Document styling
      geometry:
        - top=10pc     # 10p0
        - bottom=10pc  # 10p0
        - left=11pc    # 11p0
        - right=11pc   # 11p0
        - heightrounded
      
      # Citations and links
      colorlinks: true
      linkcolor: DarkSlateBlue
      urlcolor: DarkSlateBlue
      citecolor: DarkSlateBlue
      link-citations: true

      cite-method: citeproc  # Use citeproc by default; this can also be "biblatex"
      
      # Settings for when cite-method: biblatex
      biblio-title: "References"
      biblio-config: false  # Don't use the default template's biblatex commands
      biblatex-chicago: false  # Custom flag for enabling biblatex-chicago
      biblio-style: apa
      biblatexoptions:
        - backend=biber
      
      # The titlesec package provides its own mechanism for dealing with 
      # inline/block headings, so we need to disable pandoc's support for it
      # (see https://stackoverflow.com/q/42916124/120898)
      block-headings: false
      # Indent paragraphs instead of adding space between them
      indent: true

    html:
      theme: styles/pretty.scss
      template-partials:
        - "partials/title-block.html"
